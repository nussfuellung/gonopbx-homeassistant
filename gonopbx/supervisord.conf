[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
# Startet PostgreSQL als User 'postgres'
command=su - postgres -c "/usr/lib/postgresql/14/bin/postgres -D /etc/postgresql/14/main -c config_file=/etc/postgresql/14/main/postgresql.conf"
autorestart=true
priority=1

[program:asterisk]
command=/usr/sbin/asterisk -f
autorestart=true
priority=5

[program:gonopbx_backend]
# Nutzt das virtual environment für Python und startet FastAPI
command=/app/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app/backend
# Hier simulieren wir die .env Datei aus dem Original!
environment=DATABASE_URL="postgresql://asterisk:gonopbx_db_pass@127.0.0.1:5432/asterisk_gui",ASTERISK_HOST="127.0.0.1",ASTERISK_PORT="5038",ASTERISK_USER="admin",ASTERISK_PASSWORD="gonopbx_ami_pass",BIND_ADDRESS="127.0.0.1"
autorestart=true
priority=10

[program:nginx]
# Liefert das Frontend aus und fungiert idealerweise als Proxy fürs Backend
command=nginx -g "daemon off;"
autorestart=true
priority=20
