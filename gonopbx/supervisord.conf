[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:postgres]
command=su - postgres -c "/usr/lib/postgresql/14/bin/postgres -D /etc/postgresql/14/main -c config_file=/etc/postgresql/14/main/postgresql.conf"
autorestart=true
priority=1

[program:asterisk]
command=/usr/sbin/asterisk -f
autorestart=true
priority=5

[program:gonopbx_backend]
command=/app/venv/bin/python3 -m uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/backend
# HIER IST DER FIX: Ganz am Ende der Zeile steht jetzt ADMIN_PASSWORD="admin"
environment=DATABASE_URL="postgresql://asterisk:gonopbx_db_pass@127.0.0.1:5432/asterisk_gui",ASTERISK_HOST="127.0.0.1",ASTERISK_PORT="5038",ASTERISK_USER="admin",ASTERISK_PASSWORD="gonopbx_ami_pass",ADMIN_PASSWORD="admin"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=20
