[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=su - postgres -c "/usr/lib/postgresql/14/bin/postgres -D /etc/postgresql/14/main -c config_file=/etc/postgresql/14/main/postgresql.conf"
autorestart=true
priority=1

[program:asterisk]
# Exakt der Befehl aus der originalen docker-compose.yml, ohne User-Wechsel
command=/usr/sbin/asterisk -f
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gonopbx_backend]
command=/app/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app/backend
environment=DATABASE_URL="postgresql://asterisk:gonopbx_db_pass@127.0.0.1:5432/asterisk_gui",ASTERISK_HOST="127.0.0.1",ASTERISK_PORT="5038",ASTERISK_USER="admin",ASTERISK_PASSWORD="gonopbx_ami_pass",BIND_ADDRESS="127.0.0.1"
autorestart=true
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
