[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

; 1. DATENBANK (PostgreSQL)
[program:postgres]
; Startet den Postgres-Server unter dem Benutzer postgres
command=su postgres -c "/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data"
autorestart=true
priority=1

; 2. TELEFONANLAGE (Asterisk)
[program:asterisk]
; Führt exakt den command-Block aus der docker-compose aus
command=/bin/sh -c "cp /etc/asterisk/custom/*.conf /etc/asterisk/ 2>/dev/null || true; /usr/sbin/asterisk -f"
autorestart=true
priority=5

; 3. PYTHON BACKEND
[program:gonopbx_backend]
; Hier musst du den echten Startbefehl aus der originalen backend/Dockerfile einfügen (meist uvicorn)
command=uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app
; GANZ WICHTIG: Die Umgebungsvariablen aus der docker-compose! (Localhost statt Containernamen)
environment=DATABASE_URL="postgresql://asterisk:DEIN_DB_PASSWORT@127.0.0.1:5432/asterisk_gui",ASTERISK_HOST="127.0.0.1",ASTERISK_PORT="5038",ASTERISK_USER="admin",ASTERISK_PASSWORD="DEIN_AMI_PASSWORT"
autorestart=true
priority=10

; 4. WEBOBERFLÄCHE (Frontend)
[program:gonopbx_frontend]
; Geht davon aus, dass ein Nginx-Webserver das kompilierte Frontend ausliefert
command=nginx -g "daemon off;"
autorestart=true
priority=20
