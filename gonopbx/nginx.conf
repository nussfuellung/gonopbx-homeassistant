server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /var/www/html;
    index index.html index.htm;

    server_name _;

    # Leitet alle Frontend-Anfragen an die index.html von React/Vite weiter
    location / {
        try_files $uri $uri/ /index.html;server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /var/www/html;
    index index.html index.htm;

    server_name _;

    # 1. Frontend: Alle Anfragen, die keine Dateien sind, auf index.html leiten
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend API: Proxy-Pass zum Python-Backend
    # Wir machen das Matching hier etwas robuster für Ingress
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Wichtig: Entferne eventuelle Slashes am Ende beim Weiterleiten
        proxy_redirect off;
    }

    # 3. Statische Assets: Explizites Caching und MIME-Type Sicherheit
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }
}
    }

    # Proxy für das Python Backend (falls das Frontend API-Aufrufe über den gleichen Port macht)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
